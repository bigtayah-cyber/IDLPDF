name: Construire Ateliers Duo (Android)
on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Dépendances
        run: npm install --omit=dev --no-audit --no-fund
      - name: Polices et modules hors ligne
        run: node fetch-assets.mjs
      - name: Projet Android
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#0b0b0d' --splashBackgroundColor '#0b0b0d'
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' $M
          grep -q CAMERA $M
          npx cap sync android
      - name: APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Ateliers-Duo-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk


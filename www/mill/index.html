<style>
/* ============ Suite · fondations communes ============
   Typo : Archivo (titres, largeur variable) · IBM Plex Sans (interface) · IBM Plex Mono (étiquettes, chiffres).
   Rythme de 4 px, filets d'1 px, arrondis courts, une seule couleur vive par app, mouvements brefs. */
:root{
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r1:3px; --r2:6px; --r3:10px;
  --ease:cubic-bezier(.2,.8,.2,1); --t:.16s;
}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,currentColor 22%,transparent) transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:color-mix(in srgb,currentColor 20%,transparent);border-radius:10px;border:3px solid transparent;background-clip:content-box}
button:not(:disabled):active{transform:translateY(1px)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kbd,kbd{font-family:var(--f-mono);font-size:11px;font-weight:500;padding:1px 5px;border-radius:var(--r1);border:1px solid currentColor;opacity:.6;line-height:1.4}
/* Palette de commandes (⌘K) partagée */
.cmdk{position:fixed;inset:0;z-index:90;background:color-mix(in srgb,#000 45%,transparent);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;animation:cmdkIn var(--t) var(--ease)}
.cmdk-box{width:min(620px,100%);max-height:70vh;display:flex;flex-direction:column;background:var(--cmdk-bg,#fff);color:var(--cmdk-ink,#111);border:1px solid var(--cmdk-line,#ddd);border-radius:var(--r3);box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden}
.cmdk-in{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--cmdk-line,#ddd)}
.cmdk-in input{flex:1;height:56px;border:0;background:none;font-family:var(--f-ui);font-size:17px;outline:none;color:inherit}
.cmdk-list{overflow-y:auto;padding:6px}
.cmdk-it{width:100%;display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r2);text-align:left;color:inherit}
.cmdk-it b{font-weight:600;font-size:14.5px}
.cmdk-it small{display:block;font-size:12.5px;opacity:.6;margin-top:1px}
.cmdk-it .cat{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.55}
.cmdk-it.on{background:var(--cmdk-hi,#f1f1f1)}
.cmdk-it .ic{display:grid;place-items:center;color:var(--c,currentColor)}
.cmdk-empty{padding:28px;text-align:center;opacity:.6}
.cmdk-foot{display:flex;gap:14px;padding:9px 16px;border-top:1px solid var(--cmdk-line,#ddd);font-family:var(--f-mono);font-size:11px;opacity:.7}
@keyframes cmdkIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* Marques de la suite (tuile commune) */
.slogo{display:inline-grid;flex:none;line-height:0;width:26px;height:26px}
.slogo svg{width:100%;height:100%;border-radius:7px;display:block}

/* Layout : accueil = grille d'outils ; outil = colonne centrée (dépôt, fichier, réglages, action, résultat) */
:root{
  --bg:#eef2f0; --surface:#ffffff; --surface2:#f5f8f6; --ink:#13201b; --muted:#5b6a64; --line:#d9e2dd;
  --accent:#0a7d68; --accent-ink:#ffffff; --accent-soft:#dff1ec; --warn:#b4540a; --err:#c23b2a;
  --c-video:#0a7d68; --c-audio:#6a4bd6; --c-image:#c2621a;
  --display:"Fraunces",Georgia,serif;
  --ui:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(15,30,25,.06),0 10px 30px rgba(15,30,25,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#161e1b; --surface2:#1c2622; --ink:#e7efeb; --muted:#93a39c; --line:#2a3632;
  --accent:#3fc5a5; --accent-ink:#04201a; --accent-soft:#163a31; --warn:#f0a356; --err:#ff7a68;
  --c-video:#3fc5a5; --c-audio:#a891ff; --c-image:#f29a52; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#161e1b; --surface2:#1c2622; --ink:#e7efeb; --muted:#93a39c; --line:#2a3632;
  --accent:#3fc5a5; --accent-ink:#04201a; --accent-soft:#163a31; --warn:#f0a356; --err:#ff7a68;
  --c-video:#3fc5a5; --c-audio:#a891ff; --c-image:#f29a52; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.4); color-scheme:dark}
html{box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{border-bottom:1px solid var(--line);background:var(--surface)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em}
.brand .mill{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand .mill svg{width:22px;height:22px;stroke-width:2}
.top .sp{flex:1}
.tag{font-size:13px;color:var(--muted)}

.hero{padding-block:40px 18px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,5.4vw,48px);line-height:1.04;letter-spacing:-.02em;margin:0;text-wrap:balance;max-width:20ch}
.hero p{margin:14px 0 0;color:var(--muted);font-size:16px;max-width:56ch}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;padding-bottom:48px}
.tcard{--c:var(--c-video);display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;transition:border-color .15s,transform .15s,box-shadow .15s}
.tcard:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:var(--shadow)}
.tcard .ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);flex:none}
.tcard b{display:block;font-size:16px;margin-bottom:3px}
.tcard span.d{color:var(--muted);font-size:13.5px;display:block}
.fmts{display:flex;gap:4px;flex-wrap:wrap;margin-top:9px}
.fmts i{font-style:normal;font-family:var(--mono);font-size:10.5px;padding:2px 6px;border-radius:5px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.fmts i.to{background:none;border-color:transparent;padding:2px 0}
.section-h{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px;grid-column:1/-1}

.tool{padding-block:22px 60px;display:flex;flex-direction:column;gap:16px;max-width:680px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;align-self:flex-start}
.thead{display:flex;gap:14px;align-items:center}
.thead .ico{--c:var(--c-video);width:52px;height:52px;border-radius:15px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);flex:none}
.thead h1{font-family:var(--display);font-size:clamp(24px,4.5vw,32px);margin:0;letter-spacing:-.015em;line-height:1.1}
.thead p{margin:2px 0 0;color:var(--muted)}
.drop{border:2px dashed var(--line);border-radius:18px;background:var(--surface);padding:32px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
body.dragging .drop{border-color:var(--accent);background:var(--accent-soft)}
.drop small{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;font-weight:700;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.06)}
.btn.line{border:1px solid var(--line);background:var(--surface)}
.btn.line:hover:not(:disabled){border-color:var(--muted)}
.btn.big{height:52px;font-size:16px;padding:0 24px;border-radius:14px}
.btn.sm{height:34px;font-size:13px;padding:0 12px;border-radius:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.file{display:flex;gap:12px;align-items:center}
.file .ico{width:44px;height:44px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;color:var(--muted);flex:none}
.file .meta{flex:1;min-width:0}
.file b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file span{color:var(--muted);font-size:13px;font-family:var(--mono)}
.preview{width:100%;max-height:360px;border-radius:12px;background:#000;display:block}
audio.preview{background:none;max-height:none}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.thumbs div{position:relative;aspect-ratio:1;border-radius:10px;background:var(--surface2) center/cover no-repeat;border:1px solid var(--line)}
.thumbs div span{position:absolute;left:4px;right:4px;bottom:4px;font-size:10px;font-family:var(--mono);background:rgba(0,0,0,.6);color:#fff;border-radius:5px;padding:1px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opts{display:flex;flex-direction:column;gap:16px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.f{display:flex;flex-direction:column;gap:8px}
.hint{margin:0;color:var(--muted);font-size:13px}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{flex:1;min-height:34px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted);padding:4px 8px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.radios{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.radio{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.radio b{font-size:14px}
.radio span{color:var(--muted);font-size:12.5px}
.radio.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.check{display:flex;align-items:center;gap:10px;font-weight:600}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.input{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);padding:0 12px;width:100%;min-width:0}
.range{display:flex;align-items:center;gap:10px}
.range input{flex:1;accent-color:var(--accent)}
.range output{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:56px;text-align:right}
.trim{position:relative;height:44px;touch-action:none;user-select:none}
.trim .track{position:absolute;left:0;right:0;top:19px;height:6px;border-radius:6px;background:var(--line)}
.trim .sel{position:absolute;top:19px;height:6px;background:var(--accent);border-radius:6px}
.trim .h{position:absolute;top:8px;width:28px;height:28px;margin-left:-14px;border-radius:50%;background:var(--surface);border:2.5px solid var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.2);cursor:grab}
.trimv{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.trimv b{color:var(--ink);font-weight:500}
.go{display:flex;flex-direction:column;gap:10px}
.prog{height:8px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.stat{margin:0;font-size:14px;color:var(--muted)}
.stat.err{color:var(--err);font-weight:600}
.result{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border-radius:14px;padding:14px}
.result .ico{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.result b{display:block}
.result span{font-family:var(--mono);font-size:13px;color:var(--muted)}
.result .meta{flex:1;min-width:0}
.result .meta b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:12px;padding:10px 12px}
.note.warn{color:var(--warn)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;z-index:80;max-width:calc(100% - 32px);text-align:center}
@media (max-width:560px){.tools{grid-template-columns:1fr}.radios{grid-template-columns:1fr}.hero{padding-block:26px 10px}.tag{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Compléments V2 */
.fprev{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px;background:repeating-conic-gradient(var(--surface2) 0 25%,var(--surface) 0 50%) 0 0/16px 16px;border-radius:12px;border:1px solid var(--line)}
.fprev canvas{border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:100%}
details.more{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface2)}
details.more summary{cursor:pointer;font-weight:700;font-size:14px}
details.more[open] summary{margin-bottom:12px}
details.more .f{margin-bottom:12px}
.seg button{min-width:0}
@media (min-width:900px){
  .tool.has{max-width:1060px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
  .tool.has>.back,.tool.has>.thead{grid-column:1/-1}
  .tool.has>.card:not(.opts){grid-column:1;grid-row:3/span 2;position:sticky;top:16px}
  .tool.has>.card.opts{grid-column:2}
  .tool.has>.go{grid-column:2}
  .tool.has .preview{max-height:520px}
}
@media (min-width:600px) and (max-width:899px){.tool{max-width:760px;margin-inline:auto}}
.tool{margin-inline:auto}

/* ============ Moulinette · charte éditoriale ============
   Atelier technique : gris clairs neutres, encre, bleu cobalt seul en couleur vive, index numéroté façon fiche technique. */
:root{
  --bg:#efefec; --surface:#f8f8f6; --surface2:#e5e5e1; --ink:#121212; --muted:#64645e; --line:#d2d2cc;
  --accent:#2b3dff; --accent-ink:#ffffff; --accent-soft:#e3e6ff; --warn:#a65400; --err:#c62d1f;
  --c-video:#2b3dff; --c-audio:#0f8a5f; --c-image:#d4520b;
  --display:var(--f-display); --ui:var(--f-ui); --mono:var(--f-mono);
  --shadow:0 1px 0 rgba(0,0,0,.04),0 12px 30px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111112; --surface:#19191b; --surface2:#232326; --ink:#ededea; --muted:#9b9b95; --line:#313134;
  --accent:#7d8cff; --accent-ink:#0a0d2e; --accent-soft:#1c2147; --warn:#f0a356; --err:#ff7a68;
  --c-video:#7d8cff; --c-audio:#41c48f; --c-image:#ff8a4c; --shadow:0 16px 40px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{
  --bg:#111112; --surface:#19191b; --surface2:#232326; --ink:#ededea; --muted:#9b9b95; --line:#313134;
  --accent:#7d8cff; --accent-ink:#0a0d2e; --accent-soft:#1c2147; --warn:#f0a356; --err:#ff7a68;
  --c-video:#7d8cff; --c-audio:#41c48f; --c-image:#ff8a4c; --shadow:0 16px 40px rgba(0,0,0,.5)}
body{font-size:14.5px}
.wrap{max-width:1120px}
.top{background:var(--bg);border-bottom:1px solid var(--ink)}
.brand{font-stretch:120%;font-weight:800;font-size:20px;letter-spacing:-.04em;gap:9px}
.brand .mill{width:26px;height:26px;border-radius:var(--r1);background:var(--ink);color:var(--bg)}
.brand .mill svg{width:17px;height:17px}
.tag{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}

.hero{padding-block:52px 34px;border-bottom:2px solid var(--ink);display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px 48px;align-items:end}
.hero .kick{grid-column:1/-1;margin:0;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.hero h1{font-stretch:115%;font-size:clamp(40px,6.4vw,86px);line-height:.92;letter-spacing:-.045em;max-width:none}
.hero h1 span{display:block;color:var(--muted);font-weight:500;font-stretch:100%}
.hero p:not(.kick){margin:0;font-size:16px;line-height:1.55;color:var(--ink);opacity:.78;max-width:40ch}
.tools{display:block;padding-bottom:64px}
.section-h{display:flex;align-items:baseline;gap:14px;margin:36px 0 0;padding-bottom:12px;border-bottom:1px solid var(--ink);font-family:var(--display);font-stretch:110%;font-weight:700;font-size:15px;letter-spacing:-.01em;text-transform:none;color:var(--ink)}
.section-h span{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--muted)}
.tcard{display:grid;grid-template-columns:44px 34px minmax(0,1fr) 40px;gap:0 14px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:20px 8px;transition:background var(--t) var(--ease),padding var(--t) var(--ease)}
.tcard:hover{transform:none;box-shadow:none;border-color:var(--line);background:var(--surface);padding-left:16px}
.tcard .no{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tcard .ico{width:auto;height:auto;border-radius:0;background:none;color:var(--c)}
.tcard .ico svg{width:24px;height:24px;stroke-width:1.6}
.tcard .tx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:4px 24px;align-items:baseline}
.tcard b{font-family:var(--display);font-stretch:108%;font-size:21px;font-weight:700;letter-spacing:-.025em;margin:0}
.tcard span.d{grid-column:2;grid-row:1/span 2;font-size:13.5px;line-height:1.45}
.fmts{margin-top:2px;gap:4px}
.fmts i{border-radius:var(--r1);background:transparent;font-size:10.5px}
.tcard .arr{font-size:22px;color:var(--accent);opacity:0;transform:translateX(-10px);transition:opacity var(--t) var(--ease),transform var(--t) var(--ease);text-align:right}
.tcard:hover .arr{opacity:1;transform:none}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding-block:30px 24px}.tcard{grid-template-columns:30px 26px minmax(0,1fr);padding:16px 2px}.tcard:hover{padding-left:8px}.tcard .arr{display:none}.tcard .tx{grid-template-columns:1fr}.tcard span.d{grid-column:1;grid-row:auto}.tcard b{font-size:18px}}

/* Page d'outil */
.back{font-family:var(--mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;font-weight:500}
.thead .ico{width:auto;height:auto;border-radius:0;background:none}
.thead .ico svg{width:38px;height:38px;stroke-width:1.4}
.thead h1{font-stretch:112%;font-weight:800;font-size:clamp(28px,4.6vw,46px);letter-spacing:-.04em;line-height:.98}
.thead{padding-bottom:18px;border-bottom:2px solid var(--ink)}

<script>
(() => {
/* ============ Import de fichiers — commun à toute la suite ============
   Reconnaît le vrai format d'un fichier (pas seulement son extension), lit les formats que le navigateur
   ne sait pas lire seul (AIFF, TIFF, HEIC) et donne un message clair quand un fichier ne passe pas. */
const FI = (() => {
  const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const LIBS = {
    heic2any: "https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js",
    UTIF: "https://cdn.jsdelivr.net/npm/utif@3.1.0/UTIF.js",
    pako: "https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js",
    Tesseract: "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js",
    lamejs: "https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js",
  };
  /* Dans les versions installées (Mac, PC, Android), les modules sont livrés dans lib/ : pas besoin d'Internet */
  const LOCAL = { heic2any: "heic2any.min.js", UTIF: "UTIF.js", pako: "pako.min.js", Tesseract: "tesseract/tesseract.min.js", lamejs: "lame.min.js" };
  const localBase = () => window.SUITE_LIB_BASE ? new URL(window.SUITE_LIB_BASE, location.href).href : null;
  const addScript = src => new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.async = true; s.onload = res; s.onerror = () => { s.remove(); rej(); }; document.head.appendChild(s); });
  const loading = {};
  /* Charge une bibliothèque à la demande (une seule fois), depuis un CDN autorisé */
  function lib(name){
    if (window[name]) return Promise.resolve(window[name]);
    return loading[name] ||= (async () => {
      const base = localBase();
      if (base && LOCAL[name]) { try { await addScript(base + LOCAL[name]); if (window[name]) return window[name]; } catch {} }
      try { await addScript(LIBS[name]); } catch { delete loading[name]; throw new Error("Cette fonction télécharge un module la première fois : vérifiez la connexion Internet, puis réessayez."); }
      if (window[name]) return window[name];
      delete loading[name]; throw new Error("Bibliothèque incomplète.");
    })();
  }
  const err = msg => Object.assign(new Error(msg), { friendly: true });

  /* ---------- Reconnaître le format ---------- */
  function kindOf(b){
    if (!b.length) return "empty";
    const s = (o, n) => String.fromCharCode(...b.subarray(o, o + n));
    if (s(0, 5) === "%PDF-" || s(0, 1024).includes("%PDF-")) return "pdf";
    if (b[0] === 0x89 && s(1, 3) === "PNG") return "png";
    if (b[0] === 0xFF && b[1] === 0xD8 && b[2] === 0xFF) return "jpg";
    if (s(0, 4) === "GIF8") return "gif";
    if (s(0, 4) === "RIFF" && s(8, 4) === "WEBP") return "webp";
    if (s(0, 4) === "RIFF" && s(8, 4) === "WAVE") return "wav";
    if (s(0, 4) === "RIFF" && s(8, 4) === "AVI ") return "avi";
    if (s(0, 2) === "BM" && b.length > 26) return "bmp";
    if (s(0, 4) === "II*\0" || s(0, 4) === "MM\0*") return "tiff";
    if (s(0, 4) === "FORM" && /AIF[FC]/.test(s(8, 4))) return "aiff";
    if (s(0, 4) === "fLaC") return "flac";
    if (s(0, 4) === "OggS") return /OpusHead/.test(s(0, 200)) ? "opus" : "ogg";
    if (b[0] === 0x1A && b[1] === 0x45 && b[2] === 0xDF && b[3] === 0xA3) return "webm";
    if (s(0, 3) === "ID3") return "mp3";
    if (b[0] === 0xFF && (b[1] & 0xE0) === 0xE0) return (b[1] & 0x06) === 0 ? "aac" : "mp3";
    if (s(4, 4) === "ftyp") {
      const brands = s(8, Math.min(64, b.length - 8));
      if (/avif|avis/.test(brands)) return "avif";
      if (/heic|heix|hevc|heim|heis|hevm|hevs|mif1|msf1/.test(brands.slice(0, 4)) || /heic|heix/.test(brands)) return "heic";
      if (/M4P /.test(brands)) return "m4p";
      if (/M4A |M4B /.test(brands)) return "m4a";
      if (/^qt {2}/.test(brands)) return "mov";
      return "mp4";
    }
    if (/^(\s|﻿)*(<\?xml[^>]*>\s*)?(<!--[\s\S]*?-->\s*)*<svg[\s>]/i.test(s(0, Math.min(1024, b.length)))) return "svg";
    if (s(0, 4) === "PK\x03\x04") return "zip";
    if (s(0, 4) === "wOFF" || s(0, 4) === "wOF2" || s(0, 4) === "OTTO" || (b[0] === 0 && b[1] === 1 && b[2] === 0 && b[3] === 0)) return "font";
    return "unknown";
  }
  const sniff = async f => kindOf(new Uint8Array(await f.slice(0, 4096).arrayBuffer()));
  const FAM = { pdf: "pdf", png: "image", jpg: "image", gif: "image", webp: "image", bmp: "image", tiff: "image", heic: "image", avif: "image", svg: "image",
    mp3: "audio", aac: "audio", wav: "audio", aiff: "audio", flac: "audio", ogg: "audio", opus: "audio", m4a: "audio", m4p: "audio",
    mp4: "video", mov: "video", webm: "video", avi: "video", zip: "archive", font: "font", empty: "empty" };
  const family = k => FAM[k] || "unknown";
  const WHAT = { pdf: "un PDF", image: "une image", audio: "un son", video: "une vidéo", archive: "une archive ZIP", font: "une police" };
  /* Famille d'un fichier : contenu d'abord, extension et type MIME en secours */
  async function familyOf(f){
    const k = await sniff(f), fam = family(k);
    if (fam !== "unknown") return { kind: k, fam };
    const n = f.name || "", t = f.type || "";
    if (/^image\//.test(t) || /\.(jpe?g|png|gif|webp|bmp|tiff?|heic|heif|avif|svg)$/i.test(n)) return { kind: k, fam: "image" };
    if (/^audio\//.test(t) || /\.(mp3|m4a|aac|wav|aiff?|flac|ogg|opus|weba)$/i.test(n)) return { kind: k, fam: "audio" };
    if (/^video\//.test(t) || /\.(mp4|mov|m4v|webm|mkv|avi|3gp)$/i.test(n)) return { kind: k, fam: "video" };
    if (/pdf/.test(t) || /\.pdf$/i.test(n)) return { kind: k, fam: "pdf" };
    return { kind: k, fam: "unknown" };
  }
  const EMPTY = "Ce fichier est vide (0 octet). S'il vient d'iCloud, Drive ou d'un message, attendez qu'il soit complètement téléchargé, puis réessayez.";
  const wrong = (fam, expected) => fam === "empty" ? EMPTY : `Ce fichier est ${WHAT[fam] || "d'un type inconnu"}, pas ${expected}.`;

  /* Cherche une suite d'octets au début et à la fin d'un gros fichier (les infos MP4 peuvent être en fin de fichier) */
  async function has(f, ...needles){
    const span = 2 << 20, parts = [f.slice(0, span)]; if (f.size > span) parts.push(f.slice(Math.max(span, f.size - span)));
    for (const p of parts) { const u = new Uint8Array(await p.arrayBuffer()); let s = ""; for (let i = 0; i < u.length; i += 65536) s += String.fromCharCode.apply(null, u.subarray(i, i + 65536));
      for (const n of needles) if (s.includes(n)) return n; }
    return null;
  }

  /* ---------- Son ---------- */
  function decodeAiff(ab, ctx){
    const v = new DataView(ab), str = (o, n) => String.fromCharCode(...new Uint8Array(ab, o, n));
    const aifc = str(8, 4) === "AIFC"; let ch = 0, frames = 0, bits = 16, rate = 44100, data = -1, le = false;
    for (let o = 12; o + 8 <= ab.byteLength;) {
      const id = str(o, 4), len = v.getUint32(o + 4);
      if (id === "COMM") {
        ch = v.getInt16(o + 8); frames = v.getUint32(o + 10); bits = v.getInt16(o + 14);
        const e = v.getUint16(o + 16) & 0x7FFF, hi = v.getUint32(o + 18), lo = v.getUint32(o + 22); rate = (hi * 2 ** 32 + lo) * 2 ** (e - 16383 - 63);
        if (aifc) { const c = str(o + 26, 4); if (c === "sowt") le = true; else if (c !== "NONE" && c !== "twos") throw err("Ce fichier AIFF est compressé dans un format non pris en charge. Exportez-le en WAV ou en AIFF standard."); }
      } else if (id === "SSND") data = o + 16 + v.getUint32(o + 8);
      o += 8 + len + (len & 1);
    }
    if (!ch || data < 0 || !rate) throw err("Ce fichier AIFF est incomplet.");
    const B = Math.ceil(bits / 8); frames = Math.min(frames, Math.floor((ab.byteLength - data) / (B * ch)));
    const buf = (ctx.createBuffer ? ctx.createBuffer(ch, Math.max(1, frames), Math.round(rate)) : new AudioBuffer({ numberOfChannels: ch, length: Math.max(1, frames), sampleRate: Math.round(rate) }));
    const outs = [...Array(ch)].map((_, c) => buf.getChannelData(c)), u = new Uint8Array(ab), full = 2 ** (B * 8 - 1);
    for (let i = 0, p = data; i < frames; i++) for (let c = 0; c < ch; c++, p += B) {
      let x = 0; if (le) for (let k = B - 1; k >= 0; k--) x = x * 256 + u[p + k]; else for (let k = 0; k < B; k++) x = x * 256 + u[p + k];
      if (x >= full) x -= full * 2; outs[c][i] = x / full;
    }
    return buf;
  }
  async function audioError(f, kind){
    const fam = family(kind);
    if (kind === "empty") return EMPTY;
    if (kind === "m4p") return "Ce morceau est protégé contre la copie (Apple Music ou ancien achat iTunes) : aucune autre app ne peut l'ouvrir. Utilisez le fichier original (MP3, WAV, M4A non protégé).";
    if (fam === "image" || fam === "pdf" || fam === "archive" || fam === "font") return wrong(fam, "un son");
    if (fam === "video" || kind === "m4a" || kind === "mp4") {
      const k = await has(f, "alac", "mp4a", "soun");
      if (k === "alac") return "Ce son est en Apple Lossless (ALAC), un format que ce navigateur ne lit pas. Exportez-le en AAC, MP3 ou WAV (dans Musique : Fichier › Convertir), puis réessayez.";
      if (k !== "mp4a" && k !== "soun" && fam === "video") return "Cette vidéo n'a pas de piste son.";
    }
    if (kind === "webm" && fam === "video") return "Cette vidéo n'a pas de son, ou son format audio n'est pas lisible ici.";
    if (kind === "ogg" || kind === "opus") return "Ce navigateur ne lit pas l'OGG / Opus. Mettez l'appareil à jour (iOS 17 ou plus) ou utilisez un MP3, M4A ou WAV.";
    if (kind === "flac") return "Ce navigateur ne lit pas le FLAC. Mettez-le à jour ou utilisez un WAV ou un MP3.";
    if (/\.wma$/i.test(f.name)) return "Le WMA (Windows Media) n'est lisible par aucun navigateur. Convertissez-le en MP3.";
    if (/\.(mid|midi)$/i.test(f.name)) return "Un fichier MIDI contient des notes, pas du son enregistré. Exportez d'abord le morceau en WAV ou MP3 depuis votre logiciel de musique.";
    return "Ce son n'a pas pu être lu : le fichier est abîmé ou dans un format inconnu. Essayez en MP3, M4A ou WAV.";
  }
  /* Décode un son en AudioBuffer. ctx = AudioContext de l'app */
  async function decodeAudio(f, ctx){
    const ab = f instanceof ArrayBuffer ? f : await f.arrayBuffer(), file = f instanceof Blob ? f : new Blob([ab]);
    const kind = kindOf(new Uint8Array(ab, 0, Math.min(4096, ab.byteLength)));
    if (kind === "empty") throw err(EMPTY);
    if (kind === "aiff") return decodeAiff(ab, ctx);
    try {
      return await new Promise((res, rej) => { const p = ctx.decodeAudioData(ab.slice(0), res, rej); if (p && p.catch) p.catch(() => {}); });
    } catch { throw err(await audioError(file, kind)); }
  }

  /* ---------- Images ---------- */
  function viaImg(blob){
    return new Promise(res => { const url = URL.createObjectURL(blob), i = new Image();
      i.onload = () => { URL.revokeObjectURL(url); const w = i.naturalWidth || 1024, h = i.naturalHeight || 1024, c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(i, 0, 0, w, h); res(c); };
      i.onerror = () => { URL.revokeObjectURL(url); res(null); }; i.src = url; });
  }
  /* Ouvre une image (JPG, PNG, WEBP, GIF, BMP, AVIF, SVG, HEIC, TIFF) et la réduit à `max` px si besoin.
     Renvoie un ImageBitmap ou un canvas, tous deux dessinables avec drawImage. */
  async function image(f, { max = 0 } = {}){
    const { kind, fam } = await familyOf(f);
    if (kind === "empty") throw err(EMPTY);
    if (fam !== "image" && fam !== "unknown") throw err(wrong(fam, "une image"));
    let img = null;
    if (kind !== "svg") { try { img = await createImageBitmap(f, { imageOrientation: "from-image" }); } catch { try { img = await createImageBitmap(f); } catch {} } }
    if (!img && kind !== "heic" && kind !== "tiff") img = await viaImg(f);
    if (!img && kind === "heic") {
      try { const h = await lib("heic2any"); let o = await h({ blob: f, toType: "image/jpeg", quality: .92 }); if (Array.isArray(o)) o = o[0]; img = await createImageBitmap(o); }
      catch (e) { throw err(e.friendly || /connexion/.test(e.message) ? e.message : "Cette photo HEIC n'a pas pu être lue. Sur iPhone, réglez Appareil photo › Formats › « Le plus compatible », ou envoyez-la en JPG."); }
    }
    if (!img && kind === "tiff") {
      try { await lib("pako").catch(() => {}); const U = await lib("UTIF"), buf = await f.arrayBuffer(), ifds = U.decode(buf); U.decodeImage(buf, ifds[0]);
        const rgba = U.toRGBA8(ifds[0]); img = await createImageBitmap(new ImageData(new Uint8ClampedArray(rgba.buffer, rgba.byteOffset, rgba.length), ifds[0].width, ifds[0].height)); }
      catch (e) { throw err(/connexion/.test(e.message) ? e.message : "Cette image TIFF n'a pas pu être lue. Enregistrez-la en PNG ou JPG, puis réessayez."); }
    }
    if (!img) throw err(kind === "avif" ? "Ce navigateur ne lit pas l'AVIF. Mettez-le à jour, ou enregistrez l'image en JPG ou PNG." : "Cette image n'a pas pu être lue : le fichier est abîmé ou dans un format inconnu. Essayez en JPG ou PNG.");
    if (max && Math.max(img.width, img.height) > max) {
      const k = max / Math.max(img.width, img.height), c = document.createElement("canvas"); c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
      const g = c.getContext("2d"); g.imageSmoothingQuality = "high"; g.drawImage(img, 0, 0, c.width, c.height); img.close?.(); img = c;
    }
    return img;
  }
  /* Image → Blob JPG/PNG (pour les apps qui gardent un fichier) */
  async function imageBlob(f, { max = 0, type = "image/png", quality = .9 } = {}){
    const { kind } = await familyOf(f);
    if (!max && ["jpg", "png", "webp", "gif"].includes(kind)) return f;
    const img = await image(f, { max }); const c = document.createElement("canvas"); c.width = img.width; c.height = img.height; c.getContext("2d").drawImage(img, 0, 0);
    return new Promise(r => c.toBlob(r, type, quality));
  }

  /* ---------- Vidéo : repère les cas qu'un navigateur ne sait pas lire ---------- */
  async function videoProblem(f){
    const { kind, fam } = await familyOf(f);
    if (kind === "empty") return EMPTY;
    if (fam === "audio" || kind === "m4a") return "Ce fichier est un son, sans image.";
    if (fam !== "video" && fam !== "unknown") return wrong(fam, "une vidéo");
    if (kind === "mp4" || kind === "mov") {
      const k = await has(f, "hvc1", "hev1", "vide");
      if (k === "hvc1" || k === "hev1") return "hevc";
      if (!k) return "Ce fichier ne contient pas d'image vidéo.";
    }
    return null;
  }
  const HEVC = "Vidéo HEVC (format des iPhone) que ce navigateur ne sait pas lire. Sur Windows, installez « Extensions vidéo HEVC » depuis le Microsoft Store ou utilisez Edge ; sur iPhone, ouvrez l'app dans Safari. Pour les prochaines vidéos : Réglages › Appareil photo › Formats › « Le plus compatible ».";

  /* ---------- Sélecteurs de fichiers ---------- */
  /* Sur iPhone/iPad, un accept avec une extension « maison » (.lrc, .gpl…) grise ces fichiers : on le retire. */
  const CUSTOM = /\.(lyricstyle|lyricdrop|lrc|srt|gpl|hex|pixelcrypte|ase|aseprite|ttf|otf|woff2?)\b/i;
  function fixAccepts(){ if (!IOS) return; document.querySelectorAll('input[type=file][accept]').forEach(i => { if (CUSTOM.test(i.accept)) i.removeAttribute("accept"); }); }
  if (IOS) { document.addEventListener("click", fixAccepts, true); setTimeout(fixAccepts, 0); }

  /* Dépôt de fichiers partout dans la page (glisser-déposer) */
  function onDrop(cb){
    let depth = 0;
    addEventListener("dragenter", e => { if ([...(e.dataTransfer?.types || [])].includes("Files")) { depth++; document.body.classList.add("dragging"); } });
    addEventListener("dragleave", () => { if (--depth <= 0) { depth = 0; document.body.classList.remove("dragging"); } });
    addEventListener("dragover", e => { if ([...(e.dataTransfer?.types || [])].includes("Files")) e.preventDefault(); });
    addEventListener("drop", e => { const files = [...(e.dataTransfer?.files || [])]; depth = 0; document.body.classList.remove("dragging"); if (!files.length) return; e.preventDefault(); cb(files, e); });
  }

  return { IOS, lib, localBase, kindOf, sniff, family, familyOf, decodeAudio, image, imageBlob, videoProblem, HEVC, EMPTY, wrong, fixAccepts, onDrop };
})();

/* ============ Marques de la suite ============
   Même construction pour les 4 apps : tuile arrondie (grille 64), couleur propre, glyphe blanc épais,
   et la « pastille locale » (petit carré en haut à droite) qui signe toute la suite : rien ne quitte l'appareil. */
const SUITE_BRAND = {

    glyph: `<path d="M20 14h17l9 9v27H20z" fill="#fff"/><path d="M37 14v9h9" fill="#f7c3c5"/><path d="M27.5 33.5c0-2.6 2-4.5 4.4-4.5 1.5 0 2.6.7 3.1 1.8.5-1.1 1.6-1.8 3.1-1.8 2.4 0 4.4 1.9 4.4 4.5 0 4.6-7.5 9-7.5 9s-7.5-4.4-7.5-9z" fill="#e5484d" transform="translate(-2.5 0)"/><path d="M25.5 41.5L41 27.5" stroke="#1d1d1f" stroke-width="2.8" stroke-linecap="round"/>` },
  mill: { name: "Moulinette", bg: "#2b3dff", bg2: "#1f2bd1", fg: "#fff",
    glyph: `<g fill="#fff"><path d="M32 32V14a9 9 0 0 1 9 9z"/><path d="M32 32h18a9 9 0 0 1-9 9z"/><path d="M32 32v18a9 9 0 0 1-9-9z"/><path d="M32 32H14a9 9 0 0 1 9-9z"/></g><circle cx="32" cy="32" r="3.2" fill="#2b3dff"/>` },
  lyric: { name: "LyricDrop", bg: "#ff5a1f", bg2: "#e2400a", fg: "#fff",
    glyph: `<path d="M15 20.5v23l17-11.5z" fill="#fff"/><g fill="#fff"><rect x="36" y="20" width="14" height="4.6" rx="2.3"/><rect x="36" y="29.7" width="11" height="4.6" rx="2.3" opacity=".85"/><rect x="36" y="39.4" width="7" height="4.6" rx="2.3" opacity=".7"/></g>` },
  pixel: { name: "Pixel Crypte", bg: "#241733", bg2: "#160e21", fg: "#e8b04a",

const decodeImage = f => FI.image(f);
async function makeImages(signal){
  const o = S.o, files = [], id = S.tool;
  let total = 0, webpFallback = false;
  for (let k = 0; k < S.files.length; k++) {
    if (signal.aborted) throw new DOMException("Annulé", "AbortError");
    const f = S.files[k]; progress(k / S.files.length, "Conversion…");
    let bmp; try { bmp = await decodeImage(f); } catch (e) { throw new Error(`« ${f.name} » : ${e.friendly ? e.message : "n'a pas pu être lu."}`); }
    const max = id === "heic" ? 0 : o.size, k2 = max ? Math.min(1, max / Math.max(bmp.width, bmp.height)) : 1;
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k2); c.height = Math.round(bmp.height * k2);
    const g = c.getContext("2d");
    let fmt = id === "heic" ? "jpg" : o.fmt === "keep" ? (/png/i.test(f.type) ? "png" : /webp/i.test(f.type) ? "webp" : "jpg") : o.fmt;
    if (fmt === "jpg") { g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); }

    total += blob.size;
    let name = `${baseName(f.name)}.${fmt}`; while (files.some(x => x.name === name)) name = `${baseName(f.name)}-${files.length}.${fmt}`;
    files.push({ name, data: new Uint8Array(await blob.arrayBuffer()), blob });

  if (files.length === 1) return { blob: files[0].blob, name: files[0].name, note, before: S.files[0].size };
  return { blob: makeZip(files.map(({ name, data }) => ({ name, data }))), name: id === "heic" ? "photos-jpg.zip" : "images.zip", note, before: S.files.reduce((s, f) => s + f.size, 0), count: files.length };
}
async function grabFrames(signal){
  const o = S.o, i = S.info, base = baseName(S.files[0].name), ext = o.fmt === "png" ? "png" : "jpg", type = ext === "png" ? "image/png" : "image/jpeg";
  if (!i?.url || i.playable === false) throw new Error("Ce navigateur ne sait pas lire cette vidéo : convertissez-la d'abord avec « Compresser une vidéo ».");

  const cur = $("#pv")?.currentTime ?? 0, n = o.n, times = o.mode === "one" ? [cur] : [...Array(n)].map((_, k) => S.a + (S.b - S.a) * (n === 1 ? 0 : k / (n - 1)));
  const c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight; const g = c.getContext("2d"), files = [];

async function run(){
  if (S.job) return;

  const id = S.tool, f = S.files[0];

    let r, name;
    if (id === "video" || id === "social") { r = await transcodeVideo(ac.signal); name = `${baseName(f.name)}-${id === "social" ? (S.o.frame === "orig" ? "reseaux" : S.o.frame.replace(":", "x")) : "compresse"}.mp4`; r.preview = `<video class="preview" src="${URL.createObjectURL(r.blob)}" controls playsinline></video>`; }
    else if (id === "cut") { r = await cutLossless(); name = `${baseName(f.name)}-coupe.mp4`; }
    else if (id === "gif") { r = await makeGif(ac.signal); name = `${baseName(f.name)}.gif`; }
    else if (id === "frames") { r = await grabFrames(ac.signal); name = r.name; }
    else if (id === "extract" || id === "audio") { r = await makeAudio(); name = `${baseName(f.name)}${id === "audio" && /\.(mp3|m4a|wav)$/i.test(f.name) && f.name.toLowerCase().endsWith(r.ext) ? "-converti" : ""}.${r.ext}`; }
    else { r = await makeImages(ac.signal); name = r.name; }
    progress(1, "Terminé");

    S.result = { blob: r.blob, name, info: `${fmtSize(after)}${r.count ? ` · ${r.count} fichiers` : ""}${gain > 3 ? ` · −${gain} %` : ""}`, note: r.note, preview: r.preview };

    const ok = await saveFile(name, r.blob);
    if (!ok) { const s = $("#stat"); if (s) s.textContent = "Enregistrement annulé. Touchez « Enregistrer » pour réessayer."; }

    console.error(e); S.job = null; renderTool();
    const s = $("#stat"); if (s) { s.className = "stat err"; s.textContent = e?.name === "AbortError" ? "Annulé." : (e?.message && e.message.length < 200 && !/undefined|is not a/.test(e.message) ? e.message : "Le traitement a échoué. Ce fichier n'est peut-être pas pris en charge."); }
  }
}

/* ---------- Événements ---------- */
function pick(multi){ const fi = $("#fileIn"), t = T(); fi.accept = t.accept; fi.multiple = !!(multi ?? t.multi); fi.value = ""; fi.click(); }
function bind(){
  $("#home").onclick = renderHome;
  $("#fileIn").onchange = e => setFiles([...e.target.files]);
  $("#view").addEventListener("click", async e => {
    const card = e.target.closest("[data-tool]"); if (card) return openTool(card.dataset.tool);
    const b = e.target.closest("[data-act],[data-seg] button,[data-radio] .radio"); if (!b) return;
    const seg = b.closest("[data-seg],[data-radio]");
    if (seg && !b.dataset.act) { const k = seg.dataset.seg || seg.dataset.radio, v = b.dataset.v; S.o[k] = isNaN(+v) ? v : +v; if (k === "fmt" && S.o.fmt === "mp3" && ![128, 192, 320].includes(S.o.kbps)) S.o.kbps = 192; if (k === "fmt" && S.o.fmt === "m4a" && S.o.kbps === 320) S.o.kbps = 192; S.result = null; renderTool(); return; }

    if (a === "go") run();
    if (a === "cancel") S.job?.abort();

bind(); renderHome();
